services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: on-failure
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: sandbox
      MSSQL_DB: sandbox_db
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Sandboxpass1", "-Q", "SELECT 1", "-N", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cloudbeaver:
    image: dbeaver/cloudbeaver:25.1.0
    container_name: cloudbeaver-sqlserver
    restart: on-failure
    ports:
      - "5050:8978"
    volumes:
      - cloudbeaver_sqlserver_data:/opt/cloudbeaver/workspace
    networks:
      - sandbox_net
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data:
  cloudbeaver_sqlserver_data:

networks:
  sandbox_net:
    driver: bridge