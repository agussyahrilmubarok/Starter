services:
  postgres:
    image: postgres:18.3
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: sandbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backerhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.13
    container_name: pgadmin
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sandbox.com
      PGADMIN_DEFAULT_PASSWORD: sandboxpass
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - sandbox_net
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:

networks:
  sandbox_net:
    driver: bridge