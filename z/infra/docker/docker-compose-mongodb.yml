services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: sandbox
      MONGO_INITDB_ROOT_PASSWORD: sandbox
      MONGO_INITDB_DATABASE: sandbox_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: on-failure
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: sandbox
      ME_CONFIG_MONGODB_ADMINPASSWORD: sandbox
      ME_CONFIG_MONGODB_URL: mongodb://sandbox:sandbox@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    ports:
      - "5050:8081"
    networks:
      - sandbox_net
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:

networks:
  sandbox_net:
    driver: bridge