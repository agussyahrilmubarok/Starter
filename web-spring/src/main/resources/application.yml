server:
  port: ${SERVER_PORT:3000}
  shutdown: graceful

spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/sandbox_db}
    username: ${JDBC_DATABASE_USERNAME:sandbox}
    password: ${JDBC_DATABASE_PASSWORD:sandbox}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true

  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: false

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
    encoding: UTF-8
    mode: HTML

  lifecycle:
    timeout-per-shutdown-phase: 30s
  
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

  file:
    name: logs/app.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 1GB
      max-history: 7

  level:
    root: INFO
    io.github.agussyahrilmubarok.web: DEBUG