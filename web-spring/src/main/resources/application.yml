server:
  port: ${SERVER_PORT:3000}
  shutdown: graceful

spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/sandbox_db}
    username: ${JDBC_DATABASE_USERNAME:sandbox}
    password: ${JDBC_DATABASE_PASSWORD:sandbox}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  lifecycle:
    timeout-per-shutdown-phase: 30s