<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">web-spring</title>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link href="/favicon.ico" rel="icon" type="image/x-icon"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="crossorigin" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500,600,700&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <style>
        body {
            background-color: lightgray;
            font-family: 'Quicksand', sans-serif;
        }
    </style>
</head>
<body>

<div layout:fragment="content"></div>

<script defer th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
<script th:inline="javascript">
    var successMsg = /*[[${MSG_SUCCESS}]]*/ '';
    var infoMsg = /*[[${MSG_INFO}]]*/ '';
    var errorMsg = /*[[${MSG_ERROR}]]*/ '';
    if (successMsg) toastr.success(successMsg);
    if (infoMsg) toastr.info(infoMsg);
    if (errorMsg) toastr.error(errorMsg);
</script>
</body>
</html>
