<!DOCTYPE HTML>
<html
        layout:decorate="~{dashboard-layout}"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Dashboard</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card border-0 rounded-4 shadow-sm" th:if="${user == null}">
        <div class="card-body text-center text-muted py-5">
            User data not found. Please log in again.
        </div>
    </div>

    <div class="card border-0 rounded-4 shadow-sm" th:if="${user != null}">
        <div class="card-header fw-semibold">MY PROFILE</div>
        <div class="card-body">

            <!-- Avatar & name -->
            <div class="text-center mb-4">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center bg-dark text-white fw-bold"
                     style="width: 80px; height: 80px; font-size: 32px;"
                     th:text="${#strings.toUpperCase(#strings.substring(user.name, 0, 1))}">
                </div>
                <h5 class="mt-3 mb-0" th:text="${user.name}"></h5>
                <small class="text-muted" th:text="${user.email}"></small>
            </div>

            <hr/>

            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-semibold">FULL NAME</label>
                    <p class="form-control-plaintext fw-medium" th:text="${user.name}"></p>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-semibold">EMAIL</label>
                    <p class="form-control-plaintext fw-medium" th:text="${user.email}"></p>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-semibold">USER ID</label>
                    <p class="form-control-plaintext text-muted small" th:text="${user.id}"></p>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-semibold">MEMBER SINCE</label>
                    <p class="form-control-plaintext fw-medium"
                       th:text="${#temporals.format(user.createdAt, 'dd MMMM yyyy')}"></p>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
