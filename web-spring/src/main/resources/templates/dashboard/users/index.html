<!DOCTYPE HTML>
<html layout:decorate="~{dashboard-layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Users</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="card border-0 rounded-4 shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span th:text="#{user.list.headline}">Users</span>
                <a class="btn btn-sm btn-success rounded-4 shadow-sm border-0"
                    th:href="@{/dashboard/users/create}"
                    th:text="#{user.list.createNew}">Create New User</a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th th:text="#{user.name.label}">Full Name</th>
                                <th th:text="#{user.email.label}">Email Address</th>
                                <th th:text="#{user.createdAt.label}">Created At</th>
                                <th style="width:20%">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}" th:if="${!users.empty}">
                                <td th:text="${u.name}"></td>
                                <td th:text="${u.email}"></td>
                                <td th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}"></td>
                                <td class="text-center text-nowrap">
                                    <a class="btn btn-sm btn-primary rounded-4 shadow-sm border-0 me-1"
                                        th:href="@{/dashboard/users/edit/{id}(id=${u.id})}"
                                        th:text="#{user.list.edit}">Edit</a>

                                    <form class="d-inline" method="post"
                                        th:action="@{/dashboard/users/delete/{id}(id=${u.id})}"
                                        th:attr="onsubmit=|return confirm('[[#{delete.confirm}]]')|">
                                        <button class="btn btn-sm btn-danger rounded-4 shadow-sm border-0"
                                            type="submit"
                                            th:text="#{user.list.delete}">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${users.empty}">
                                <td class="text-center text-muted py-4" colspan="4"
                                    th:text="#{user.list.empty}">No users found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
