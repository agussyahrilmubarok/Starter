<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">

<head>
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE" th:text="#{app.title}">web-spring</title>
    <th:block th:replace="~{fragments/head :: common-head}"></th:block>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow-sm">
        <a class="navbar-brand fw-bold fs-5" th:href="@{/dashboard}" th:text="'⚡ ' + #{app.title}">⚡ web-spring</a>

        <button class="navbar-toggler" data-bs-target="#navbarContent" data-bs-toggle="collapse" type="button"
            th:attr="aria-label=#{navigation.toggle}">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-light" data-bs-toggle="dropdown" href="#">
                        👤 <span th:text="${userProfile?.email}">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" th:href="@{/dashboard/profile}" th:text="#{navigation.profile}">My
                                Profile</a>
                        </li>
                        <li>
                            <hr class="dropdown-divider" />
                        </li>
                        <li>
                            <form method="post" style="display:inline" th:action="@{/sign-out}">
                                <input th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
                                    th:value="${_csrf != null ? _csrf.token : ''}" type="hidden" />
                                <button class="dropdown-item text-danger w-100 text-start border-0 bg-transparent"
                                    type="submit" th:text="#{navigation.signOut}">Sign Out</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row g-4">

            <div class="col-12 col-md-3">
                <div class="card border-0 rounded-4 shadow-sm">
                    <div class="card-header">MAIN MENU</div>
                    <div class="card-body p-2">
                        <div class="list-group list-group-flush">
                            <a class="list-group-item list-group-item-action rounded-3" th:href="@{/dashboard}"
                                th:classappend="${requestUri == '/dashboard'} ? ' active'"
                                th:text="#{navigation.dashboard}">Dashboard</a>

                            <a class="list-group-item list-group-item-action rounded-3" th:href="@{/dashboard/users}"
                                th:classappend="${#strings.startsWith(requestUri, '/dashboard/users')} ? ' active'"
                                th:text="#{navigation.users}">Users</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-9">
                <div layout:fragment="content"></div>
            </div>

        </div>
    </div>

    <script defer th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

    <script th:inline="javascript">
        var successMsg = /*[[${MSG_SUCCESS}]]*/ '';
        var infoMsg = /*[[${MSG_INFO}]]*/ '';
        var errorMsg = /*[[${MSG_ERROR}]]*/ '';
        if (successMsg) toastr.success(successMsg);
        if (infoMsg) toastr.info(infoMsg);
        if (errorMsg) toastr.error(errorMsg);
    </script>

</body>

</html>
