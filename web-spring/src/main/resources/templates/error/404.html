<!DOCTYPE HTML>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{error.page.headline}">Page Not Found</title>
</head>
<body>
<div layout:fragment="content">
    <div class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="text-center">
            <h1 class="display-1 fw-bold text-secondary">404</h1>
            <h4 class="fw-semibold mb-2" th:text="#{error.page.headline}">Page Not Found</h4>
            <p class="text-muted mb-4" th:text="${message} ?: #{error.page.message}"></p>
            <a class="btn btn-primary rounded-4 px-4"
               th:href="@{/}"
               th:text="#{error.backToHome}">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
