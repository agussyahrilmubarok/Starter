<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web-go</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Quicksand:400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: lightgray;
        font-family: "Quicksand", sans-serif;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow-sm">
      <a class="navbar-brand fw-bold fs-5" href="/dashboard">⚡ web-go</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarContent"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle text-light"
              href="#"
              data-bs-toggle="dropdown"
            >
              👤 {{if .UserProfile}}{{.UserProfile.Email}}{{else}}User{{end}}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="/dashboard/profile"
                  >My Profile</a
                >
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <form
                  method="POST"
                  action="/sign-out"
                  style="display: inline"
                >
                  <button type="submit" class="dropdown-item text-danger">
                    Sign Out
                  </button>
                </form>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>

    <div class="container mt-4 mb-5">
    <div class="row g-4">
      <div class="col-12 col-md-3">
        <div class="card border-0 rounded-4 shadow-sm">
          <div class="card-header">MAIN MENU</div>
          <div class="card-body p-2">
            <div class="list-group list-group-flush">
              <a href="/dashboard" class="list-group-item list-group-item-action rounded-3">Dashboard</a>
              <a href="/dashboard/users" class="list-group-item list-group-item-action rounded-3">Users</a>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-9">
        {{template "content" .}}
      </div>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
