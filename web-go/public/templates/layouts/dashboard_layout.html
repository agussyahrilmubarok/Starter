<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <title>{{ .Title }} | web-go</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500,600,700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet" />

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

  <style>
    body {
      background-color: lightgray;
      font-family: "Quicksand", sans-serif;
    }

    .dropdown-menu .dropdown-item.active {
      background-color: #0d6efd;
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow-sm">
    <a class="navbar-brand fw-bold fs-5" href="/dashboard">
      ⚡ web-go
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarContent"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle text-light"
            href="#"
            data-bs-toggle="dropdown"
          >
            👤 {{ if .UserProfile }}{{ .UserProfile.Email }}{{ else }}User{{ end }}
          </a>

          <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
            <li>
              <a class="dropdown-item" href="/dashboard/profile">
                My Profile
              </a>
            </li>

            <li>
              <hr class="dropdown-divider" />
            </li>

            <li>
              <form method="POST" action="/sign-out" style="display:inline;">
                <button
                  type="submit"
                  class="dropdown-item text-danger w-100 text-start border-0 bg-transparent"
                >
                  Sign Out
                </button>
              </form>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <div class="row g-4">

      <!-- Sidebar -->
      <div class="col-12 col-md-3">
        <div class="card border-0 rounded-4 shadow-sm">
          <div class="card-header text-uppercase small fw-semibold">
            Main Menu
          </div>

          <div class="card-body p-2">
            <div class="list-group list-group-flush">

              <a
                href="/dashboard"
                class="list-group-item list-group-item-action rounded-3 {{ if eq .RequestURI "/dashboard" }}active{{ end }}"
              >
                Dashboard
              </a>

              <a
                href="/dashboard/users"
                class="list-group-item list-group-item-action rounded-3 {{ if hasPrefix .RequestURI "/dashboard/users" }}active{{ end }}"
              >
                Users
              </a>

            </div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-12 col-md-9">
        {{ template "content" . }}
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>

  <script>
    var successMsg = "{{ .MsgSuccess }}";
    var infoMsg = "{{ .MsgInfo }}";
    var errorMsg = "{{ .MsgError }}";

    if (successMsg) toastr.success(successMsg);
    if (infoMsg) toastr.info(infoMsg);
    if (errorMsg) toastr.error(errorMsg);
  </script>
</body>

</html>
