{{ define "content" }}

<div class="card border-0 rounded-4 shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>USERS</span>
    <a href="/dashboard/users/add" class="btn btn-sm btn-success rounded-4 shadow-sm border-0">
      ADD USER
    </a>
  </div>
  <div class="card-body">

    <div class="table-responsive">
      <table class="table table-bordered">
        <thead class="bg-dark text-white">
          <tr>
            <th>Full Name</th>
            <th>Email Address</th>
            <th style="width:20%">Actions</th>
          </tr>
        </thead>
        <tbody>
          {{range .Values}}
          <tr>
            <td>{{.Name}}</td>
            <td>{{.Email}}</td>
            <td class="text-center">
              <a href="/dashboard/users/{{.ID}}/edit"
                 class="btn btn-sm btn-primary rounded-4 shadow-sm border-0 me-1">
                EDIT
              </a>
              <form method="POST" action="/dashboard/users/{{.ID}}/delete"
                    style="display:inline"
                    onsubmit="return confirm('Are you sure you want to delete this user?')">
                <button type="submit" class="btn btn-sm btn-danger rounded-4 shadow-sm border-0">
                  DELETE
                </button>
              </form>
            </td>
          </tr>
          {{else}}
          <tr>
            <td colspan="3" class="text-center text-muted py-4">No users found</td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
</div>

{{ end }}
