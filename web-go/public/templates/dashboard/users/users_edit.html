{{ define "content" }}

<div class="card border-0 rounded-4 shadow-sm">
  <div class="card-header fw-semibold">Edit User</div>
  <div class="card-body p-4">

    <form method="POST" action="/dashboard/users/{{ .Values.ID }}/edit">
      <div class="form-group mb-3">
        <label class="mb-1 fw-bold">Full Name</label>
        <input
          type="text"
          name="name"
          value="{{ .Values.Name }}"
          class="form-control rounded-3 {{ if .Errors.Name }}is-invalid{{ end }}"
          placeholder="Enter your full name"
        />
        {{ if .Errors.Name }}
        <div class="invalid-feedback">{{ .Errors.Name }}</div>
        {{ end }}
      </div>

      <div class="form-group mb-3">
        <label class="mb-1 fw-bold">Email Address</label>
        <input
          type="email"
          name="email"
          value="{{ .Values.Email }}"
          class="form-control rounded-3 {{ if .Errors.Email }}is-invalid{{ end }}"
          placeholder="Enter your email address"
        />
        {{ if .Errors.Email }}
        <div class="invalid-feedback">{{ .Errors.Email }}</div>
        {{ end }}
      </div>

      <div class="form-group mb-3">
        <label class="mb-1 fw-bold">Password</label>
        <input
          type="password"
          name="password"
          class="form-control rounded-3 {{ if .Errors.Password }}is-invalid{{ end }}"
          placeholder="Leave blank to keep current password"
        />
        {{ if .Errors.Password }}
        <div class="invalid-feedback">{{ .Errors.Password }}</div>
        {{ end }}
      </div>

      <button type="submit" class="btn btn-md btn-primary rounded-4 shadow-sm border-0">
        Update
      </button>
      <a href="/dashboard/users" class="btn btn-md btn-secondary rounded-4 shadow-sm border-0 ms-2">
        Cancel
      </a>
    </form>
  </div>
</div>

{{ end }}
