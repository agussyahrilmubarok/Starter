{{ define "content" }}

<div class="min-vh-100 d-flex align-items-center justify-content-center">
  <div class="col-11 col-sm-10 col-md-8 col-lg-5">
    <div class="card border-0 rounded-4 shadow-lg">
      <div class="card-body p-4 p-md-5">
        <h3 class="fw-bold text-center mb-2">Create Account</h3>
        <p class="text-secondary text-center mb-4">Sign up to continue</p>

        <form method="POST" action="/sign-up">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input
              type="text"
              name="name"
              value="{{ .Form.Name }}"
              class="form-control rounded-3 {{if .Errors.Name}}is-invalid{{end}}"
              placeholder="Enter your full name"
            />
            {{if .Errors.Name}}
            <div class="invalid-feedback">{{.Errors.Name}}</div>
            {{end}}
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input
              type="email"
              name="email"
              value="{{ .Form.Email }}"
              class="form-control rounded-3 {{if .Errors.Email}}is-invalid{{end}}"
              placeholder="Enter your email"
            />
            {{if .Errors.Email}}
            <div class="invalid-feedback">{{.Errors.Email}}</div>
            {{end}}
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input
              type="password"
              name="password"
              value="{{ .Form.Password }}"
              class="form-control rounded-3 {{if .Errors.Password}}is-invalid{{end}}"
              placeholder="Enter your password"
            />
            {{if .Errors.Password}}
            <div class="invalid-feedback">{{.Errors.Password}}</div>
            {{end}}
          </div>

          {{if .Errors.Error}}
          <div class="alert alert-danger py-2">{{.Errors.Error}}</div>
          {{end}}

          <button type="submit" class="btn btn-primary w-100 rounded-4 mt-2">
            Sign Up
          </button>

          <div class="text-center mt-3">
            <span class="text-secondary">Already have an account?</span>
            <a href="/sign-in" class="text-decoration-none fw-semibold ms-1"
              >Sign In</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{{ end }}
