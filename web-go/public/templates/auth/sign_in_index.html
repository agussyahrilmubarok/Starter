{{ define "content" }}

<div class="min-vh-100 d-flex align-items-center justify-content-center">
  <div class="col-11 col-sm-10 col-md-8 col-lg-5">
    <div class="card border-0 rounded-4 shadow-lg">
      <div class="card-body p-4 p-md-5">
        <h3 class="fw-bold text-center mb-2">Sign In</h3>
        <p class="text-secondary text-center mb-4">Welcome back! Please enter your details</p>

        <form method="POST" action="/sign-in">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input
              type="email"
              name="email"
              value="{{ .Values.Email }}"
              class="form-control rounded-3 {{if .Errors.Email}}is-invalid{{end}}"
              placeholder="Enter your email"
            />
            {{if .Errors.Email}}
            <div class="invalid-feedback">{{.Errors.Email}}</div>
            {{end}}
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input
              type="password"
              name="password"
              value="{{ .Values.Password }}"
              class="form-control rounded-3 {{if .Errors.Password}}is-invalid{{end}}"
              placeholder="Enter your password"
            />
            {{if .Errors.Password}}
            <div class="invalid-feedback">{{.Errors.Password}}</div>
            {{end}}
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-4 mt-2">
            Sign In
          </button>

          <div class="text-center mt-3">
            <span class="text-secondary">Don't have an account?</span>
            <a href="/sign-up" class="text-decoration-none fw-semibold ms-1">Sign Up</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{{ end }}
