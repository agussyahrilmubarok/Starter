basePath: /api
definitions:
  dto.CreateUserRequest:
    properties:
      email:
        maxLength: 150
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.SignInRequest:
    properties:
      email:
        maxLength: 150
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.SignUpRequest:
    properties:
      email:
        maxLength: 150
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.UpdateUserRequest:
    properties:
      email:
        maxLength: 150
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    type: object
  payload.ErrorResponse:
    properties:
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  payload.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
  description: RESTful API documentation for backend services.
  title: Backend REST API
  version: 1.0.0
paths:
  /v1/auth/sign-in:
    post:
      consumes:
      - application/json
      description: Authenticate user and return token
      parameters:
      - description: Sign in request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payload.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
      summary: Sign in
      tags:
      - Auth
  /v1/auth/sign-up:
    post:
      consumes:
      - application/json
      description: Register a new user
      parameters:
      - description: Sign up request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/payload.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
      summary: Sign up
      tags:
      - Auth
  /v1/users:
    get:
      description: Get all users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payload.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: Create user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/payload.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - Users
  /v1/users/{id}:
    delete:
      description: Delete user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payload.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - Users
    get:
      description: Get user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payload.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Update user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payload.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: 'Enter your JWT token in the format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
