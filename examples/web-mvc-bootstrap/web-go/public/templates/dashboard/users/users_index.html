{{ define "content" }}

<div class="card border-0 rounded-4 shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Users</span>
    <a href="/dashboard/users/create" class="btn btn-sm btn-success rounded-4 shadow-sm border-0">
      Create New User
    </a>
  </div>
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Full Name</th>
            <th>Email Address</th>
            <th>Created At</th>
            <th style="width:20%">Actions</th>
          </tr>
        </thead>
        <tbody>
          {{ if .Values }}
          {{ range .Values }}
          <tr>
            <td>{{ .Name }}</td>
            <td>{{ .Email }}</td>
            <td>{{ .CreatedAt.Format "02 Jan 2006" }}</td>
            <td class="text-center text-nowrap">
              <a href="/dashboard/users/{{ .ID }}/edit"
                class="btn btn-sm btn-primary rounded-4 shadow-sm border-0 me-1">
                Edit
              </a>
              <form class="d-inline js-submit-confirm" method="POST" action="/dashboard/users/{{ .ID }}/delete"
                data-confirm-message="Are you sure you want to delete this? This action cannot be undone">
                <button type="submit" class="btn btn-sm btn-danger rounded-4 shadow-sm border-0">
                  Delete
                </button>
              </form>
            </td>
          </tr>
          {{ end }}
          {{ else }}
          <tr>
            <td colspan="4" class="text-center text-muted py-4">No users found</td>
          </tr>
          {{ end }}
        </tbody>
      </table>
    </div>
  </div>
</div>

{{ end }}
