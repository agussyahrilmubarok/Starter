app:
  name: "web"
  port: 3000
  env: "development"
  session:
    secret: "SecretKeySecretKeySecretKeySecretKeySecretKeySecretKeySecretKeySecretKey"
    max_age: 604800
  logger:
    file_path: "logs/app.log"
    level: "debug"

postgres:
  host: "localhost"
  port: 5432
  name: "sandbox_db"
  user: "sandbox"
  password: "sandbox"
  ssl_mode: "disable"
  timezone: "Asia/Jakarta"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30