<!DOCTYPE HTML>
<html layout:decorate="~{dashboard-layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{profile.headline}">Profile</title>
</head>

<body>
<div layout:fragment="content">

    <div class="card border-0 rounded-4 shadow-sm" th:if="${userProfile == null}">
        <div class="card-body text-center text-muted py-5" th:text="#{profile.notFound}">
            User data not found. Please log in again.
        </div>
    </div>

    <div class="card border-0 rounded-4 shadow-sm" th:if="${userProfile != null}">
        <div class="card-header fw-semibold" th:text="#{profile.headline}">My Profile</div>
        <div class="card-body">

            <div class="text-center mb-4">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center bg-dark text-white fw-bold"
                     style="width: 80px; height: 80px; font-size: 32px;"
                     th:text="${#strings.toUpperCase(#strings.substring(userProfile.name, 0, 1))}">
                </div>
                <h5 class="mt-3 mb-0" th:text="${userProfile.name}"></h5>
                <small class="text-muted" th:text="${userProfile.email}"></small>
            </div>

            <hr/>

            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-semibold"
                           th:text="#{user.name.label}">Full Name</label>
                    <p class="form-control-plaintext fw-medium" th:text="${userProfile.name}"></p>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-semibold"
                           th:text="#{user.email.label}">Email</label>
                    <p class="form-control-plaintext fw-medium" th:text="${userProfile.email}"></p>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-semibold"
                           th:text="#{user.id.label}">User ID</label>
                    <p class="form-control-plaintext text-muted small" th:text="${userProfile.id}"></p>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label text-muted small fw-semibold"
                           th:text="#{user.createdAt.label}">Member Since</label>
                    <p class="form-control-plaintext fw-medium"
                       th:text="${#temporals.format(userProfile.createdAt, 'dd MMMM yyyy')}"></p>
                </div>
            </div>

        </div>
    </div>
</div>
</body>

</html>
