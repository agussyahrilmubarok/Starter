<!DOCTYPE HTML>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{home.title}">Home</title>
</head>

<body>
<div layout:fragment="content">
    <div class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 col-sm-10">
                    <div class="card border-0 rounded-5 shadow-lg">
                        <div class="card-body p-5 text-center">
                            <span class="badge bg-primary px-3 py-2 mb-3 rounded-pill"
                                  th:text="#{home.index.badge}">Spring Boot + Thymeleaf</span>
                            <h1 class="display-3 fw-bold mb-2" th:text="#{app.name}">web-spring</h1>
                            <p class="text-muted mb-4" th:text="#{home.index.text}">
                                A simple Spring Boot web application
                            </p>
                            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                                <a class="btn btn-primary btn-lg px-5 rounded-pill"
                                   th:href="@{/sign-up}"
                                   th:text="#{home.index.getStarted}">Get Started</a>
                                <a class="btn btn-dark btn-lg px-5 rounded-pill"
                                   th:href="@{/sign-in}"
                                   th:text="#{home.index.signIn}">Sign In</a>
                            </div>
                            <div class="mt-4 text-dark opacity-50 small"
                                 th:text="#{home.index.footer}">
                                starter.agussyahrilmubarok.github.io
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
