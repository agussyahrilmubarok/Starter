{{ define "content" }}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-sm-10">
                <div class="card border-0 rounded-5 shadow-lg">
                    <div class="card-body p-5 text-center">
                        <span class="badge bg-primary px-3 py-2 mb-3 rounded-pill">
                            {{ index .T "home.index.badge" }}
                        </span>
                        <h1 class="display-3 fw-bold mb-2">{{ index .T "app.name" }}</h1>
                        <p class="text-muted mb-4">{{ index .T "home.index.text" }}</p>
                        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                            <a href="/sign-up" class="btn btn-primary btn-lg px-5 rounded-pill">
                                {{ index .T "home.index.getStarted" }}
                            </a>
                            <a href="/sign-in" class="btn btn-dark btn-lg px-5 rounded-pill">
                                {{ index .T "home.index.signIn" }}
                            </a>
                        </div>
                        <div class="mt-4 text-dark opacity-50 small">{{ index .T "home.index.footer" }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{ end }}
