<!DOCTYPE html>
<html lang="{{ .Lang }}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <title>{{ index .T "app.title" }}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500,600,700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
  <style>
    body {
      background-color: lightgray;
      font-family: "Quicksand", sans-serif;
    }

    .dropdown-menu .dropdown-item.active {
      background-color: #0d6efd;
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- Public Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow-sm">
    <a class="navbar-brand fw-bold fs-5" href="/">⚡ {{ index .T "app.title" }}</a>
    <div class="ms-auto">
      {{ template "lang_switcher" . }}
    </div>
  </nav>

  {{ template "content" . }}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script type="text/javascript">
    var errorMessage = "{{ .MsgError }}";
    if (errorMessage) toastr.error(errorMessage);
    var successMessage = "{{ .MsgInfo }}";
    if (successMessage) toastr.success(successMessage);
  </script>
</body>

</html>
